name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rules:
    name: CLAUDE.md 절대 규칙 (기계 강제)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/lint-rules.sh

  ts:
    name: TypeScript (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  go:
    name: Go (vet · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.work·go.mod의 go 지시자(1.25)와 일치시켜야 한다 (1.23이면 go.work 로드 실패)
          go-version: "1.25"
          cache-dependency-path: |
            apps/worker/go.sum
            packages/libqueue-go/go.sum
      # go.work 멀티모듈 — 루트 ./...는 "directory prefix . does not contain modules"로 실패한다.
      # 반드시 명시적 모듈 경로를 사용한다 (DEV-sub-08 §H).
      - run: go vet ./apps/worker/... ./packages/libqueue-go/...
      - run: go build ./apps/worker/... ./packages/libqueue-go/...
      - run: go test ./apps/worker/... ./packages/libqueue-go/...

  compose:
    name: Compose config 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # compose 파일은 app 프로파일의 ${ONDA_MASTER_KEY:?} 보간을 전체 파일에서 수행하므로
      # 미설정 시 config 검증도 실패한다. 문법 검증용 placeholder 주입 (기동 아님).
      - run: docker compose -f deploy/compose.yaml --profile full --profile app config -q
        env:
          ONDA_MASTER_KEY: ci-config-validation-placeholder
