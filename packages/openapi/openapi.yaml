# Onda API — OpenAPI 3.1 스펙 (단일 출처, ADR-5)
# TODO(S3): 이 스펙에서 TS 클라이언트·콘솔 훅을 코드젠으로 생성하고
#           src/의 수기 클라이언트를 대체한다. 스펙 드리프트 검사는 IT-6.
openapi: 3.1.0
info:
  title: Onda API
  version: 0.1.0
  description: 관리 API + Ingestion API
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: liveness
  /v1/auth/signup:
    post:
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, tenant_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                tenant_name: { type: string }
      responses:
        "201":
          description: 가입 완료 — 키 원문은 이 응답에서 1회만 노출
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string, format: uuid }
                  app_id: { type: string, format: uuid }
                  sdk_key: { type: string }
                  server_key: { type: string }
        "409": { description: 이메일 중복 }
  /v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: 세션 쿠키 발급 }
        "401": { description: 인증 실패 }
  /v1/auth/logout:
    post:
      operationId: logout
      responses:
        "200": { description: 세션 폐기 }
  /v1/auth/me:
    get:
      operationId: me
      responses:
        "200":
          description: 현재 멤버
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_id: { type: string, format: uuid }
                  tenant_id: { type: string, format: uuid }
                  email: { type: string }
                  name: { type: string }
                  role: { type: string, enum: [owner, admin, editor, viewer] }
        "401": { description: 미인증 }
  /v1/track:
    post:
      operationId: track
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch]
              properties:
                batch:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [insert_id, event, client_ts]
                    properties:
                      insert_id: { type: string, format: uuid }
                      anon_id: { type: [string, "null"], format: uuid }
                      external_id: { type: [string, "null"] }
                      event: { type: string, maxLength: 128 }
                      properties: { type: object }
                      client_ts: { type: string, format: date-time }
                device:
                  type: object
                  required: [device_id, platform]
                  properties:
                    device_id: { type: string, format: uuid }
                    platform: { type: string, enum: [ios, android] }
                    app_version: { type: string }
                    os_version: { type: string }
                    model: { type: string }
                    locale: { type: string }
      responses:
        "202":
          description: 수집 큐 적재 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  request_id: { type: string, format: uuid }
        "400": { description: 스키마 오류 }
        "401": { description: 키 무효 }
  /v1/identify:
    post:
      operationId: identify
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_id]
              properties:
                external_id: { type: string, maxLength: 256 }
                anon_id: { type: [string, "null"], format: uuid }
                attributes: { type: object, description: "키 128자·값 1KB 상한, null = unset" }
                device: { $ref: "#/components/schemas/Device" }
      responses:
        "202": { description: 병합 큐 적재 }
        "400": { description: 스키마 오류 }
        "401": { description: 키 무효 }
  /v1/users/attributes:
    post:
      operationId: updateAttributes
      description: Server Key 전용
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [external_id, attributes]
                    properties:
                      external_id: { type: string }
                      attributes: { type: object }
      responses:
        "202": { description: 큐 적재 }
        "401": { description: 키 무효 (SDK Key는 403 아님 401) }
  /v1/devices/token:
    post:
      operationId: registerToken
      description: SDK Key 전용
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device, push_token]
              properties:
                device: { $ref: "#/components/schemas/Device" }
                push_token: { type: string }
                os_permission: { type: string, enum: [granted, denied, undetermined] }
                anon_id: { type: [string, "null"], format: uuid }
                external_id: { type: [string, "null"] }
      responses:
        "202": { description: 큐 적재 }
  /v1/users/{externalId}:
    delete:
      operationId: deleteUser
      description: Server Key 전용 — 30일 내 완전 삭제 보장 경로의 진입점
      security:
        - apiKey: []
      parameters:
        - name: externalId
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: 삭제 큐 적재 }
components:
  schemas:
    Device:
      type: object
      required: [device_id, platform]
      properties:
        device_id: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        app_version: { type: string }
        os_version: { type: string }
        model: { type: string }
        locale: { type: string }
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: SDK Key(pk_) 또는 Server Key(sk_)
