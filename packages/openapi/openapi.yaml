# Onda API — OpenAPI 3.1 스펙 (단일 출처, ADR-5)
# TODO(S3): 이 스펙에서 TS 클라이언트·콘솔 훅을 코드젠으로 생성하고
#           src/의 수기 클라이언트를 대체한다. 스펙 드리프트 검사는 IT-6.
openapi: 3.1.0
info:
  title: Onda API
  version: 0.1.0
  description: 관리 API + Ingestion API
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: liveness
  /v1/auth/signup:
    post:
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, tenant_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                tenant_name: { type: string }
      responses:
        "201":
          description: 가입 완료 — 키 원문은 이 응답에서 1회만 노출
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string, format: uuid }
                  app_id: { type: string, format: uuid }
                  sdk_key: { type: string }
                  server_key: { type: string }
        "409": { description: 이메일 중복 }
  /v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: 세션 쿠키 발급 }
        "401": { description: 인증 실패 }
  /v1/auth/logout:
    post:
      operationId: logout
      responses:
        "200": { description: 세션 폐기 }
  /v1/auth/me:
    get:
      operationId: me
      responses:
        "200":
          description: 현재 멤버
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_id: { type: string, format: uuid }
                  tenant_id: { type: string, format: uuid }
                  email: { type: string }
                  name: { type: string }
                  role: { type: string, enum: [owner, admin, editor, viewer] }
        "401": { description: 미인증 }
  /v1/track:
    post:
      operationId: track
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch]
              properties:
                batch:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [insert_id, event, client_ts]
                    properties:
                      insert_id: { type: string, format: uuid }
                      anon_id: { type: [string, "null"], format: uuid }
                      external_id: { type: [string, "null"] }
                      event: { type: string, maxLength: 128 }
                      properties: { type: object }
                      client_ts: { type: string, format: date-time }
                device:
                  type: object
                  required: [device_id, platform]
                  properties:
                    device_id: { type: string, format: uuid }
                    platform: { type: string, enum: [ios, android] }
                    app_version: { type: string }
                    os_version: { type: string }
                    model: { type: string }
                    locale: { type: string }
      responses:
        "202":
          description: PostgreSQL 이벤트 inbox 및 전달용 outbox 영속 저장 완료. 중복 insert_id는 최초 접수 시각·순서를 유지합니다.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  request_id: { type: string, format: uuid }
        "400": { description: 스키마 오류 }
        "401": { description: 키 무효 }
        "503": { description: 이벤트 영속 저장 실패. 같은 insert_id로 재시도할 수 있습니다. }
  /v1/identify:
    post:
      operationId: identify
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_id]
              properties:
                external_id: { type: string, maxLength: 256 }
                anon_id: { type: [string, "null"], format: uuid }
                attributes: { type: object, description: "키 128자·값 1KB 상한, null = unset" }
                device: { $ref: "#/components/schemas/Device" }
      responses:
        "202": { description: 병합 큐 적재 }
        "400": { description: 스키마 오류 }
        "401": { description: 키 무효 }
  /v1/users/attributes:
    post:
      operationId: updateAttributes
      description: Server Key 전용
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [external_id, attributes]
                    properties:
                      external_id: { type: string }
                      attributes: { type: object }
      responses:
        "202": { description: 큐 적재 }
        "401": { description: 키 무효 (SDK Key는 403 아님 401) }
  /v1/devices/token:
    post:
      operationId: registerToken
      description: SDK Key 전용
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device, push_token]
              properties:
                device: { $ref: "#/components/schemas/Device" }
                push_token: { type: string }
                os_permission: { type: string, enum: [granted, denied, undetermined] }
                anon_id: { type: [string, "null"], format: uuid }
                external_id: { type: [string, "null"] }
      responses:
        "202": { description: 큐 적재 }
  /v1/users/{externalId}:
    delete:
      operationId: deleteUser
      description: Server Key 전용 — 30일 내 완전 삭제 보장 경로의 진입점
      security:
        - apiKey: []
      parameters:
        - name: externalId
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: 삭제 큐 적재 }
  /v1/apps/{appId}/journeys:
    parameters:
      - { $ref: "#/components/parameters/AppId" }
    get:
      operationId: listJourneys
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Journeys and worker rollout capabilities
          content:
            application/json:
              schema:
                type: object
                required: [journeys, capabilities]
                properties:
                  journeys: { type: array, items: { $ref: "#/components/schemas/JourneySummary" } }
                  capabilities: { $ref: "#/components/schemas/JourneyCapabilities" }
    post:
      operationId: createJourney
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: "#/components/requestBodies/JourneyUpsert" }
      responses:
        "201": { description: "Draft saved, returns id and revision (compare with validate response before activating)" }
        "400": { description: Invalid wire schema }
  /v1/apps/{appId}/journeys/{id}:
    parameters:
      - { $ref: "#/components/parameters/AppId" }
      - { $ref: "#/components/parameters/JourneyId" }
    get:
      operationId: getJourney
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Draft and immutable experiment allocations
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/JourneySummary" }
                  - type: object
                    required: [draft_definition, revision, published_ab_nodes, capabilities]
                    properties:
                      draft_definition: { $ref: "#/components/schemas/JourneyDefinition" }
                      revision: { type: string, pattern: "^[a-f0-9]{64}$" }
                      published_ab_nodes:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            variants: { type: array, items: { $ref: "#/components/schemas/ABVariant" } }
                      capabilities: { $ref: "#/components/schemas/JourneyCapabilities" }
        "404": { description: Journey not accessible }
    patch:
      operationId: updateJourney
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: "#/components/requestBodies/JourneyUpsert" }
      responses:
        "200": { description: "Draft or paused journey saved, returns ok and revision" }
        "400": { description: Invalid wire schema }
        "404": { description: Journey is not editable }
    delete:
      operationId: archiveJourney
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Archived and active executions exited atomically }
  /v1/apps/{appId}/journeys/{id}/validate:
    parameters:
      - { $ref: "#/components/parameters/AppId" }
      - { $ref: "#/components/parameters/JourneyId" }
    post:
      operationId: validateJourney
      security: [{ sessionCookie: [] }]
      responses:
        "201":
          description: Graph, conditions, published experiments and rollout validation
          content:
            application/json:
              schema:
                type: object
                required: [issues, estimated_count, revision]
                properties:
                  revision: { type: string, pattern: "^[a-f0-9]{64}$" }
                  estimated_count: { type: [integer, "null"] }
                  issues: { type: array, items: { $ref: "#/components/schemas/JourneyValidationIssue" } }
  /v1/apps/{appId}/journeys/{id}/activate:
    parameters:
      - { $ref: "#/components/parameters/AppId" }
      - { $ref: "#/components/parameters/JourneyId" }
    post:
      operationId: activateJourney
      description: Locks the journey, revalidates the draft and publishes an immutable version. v2 requires the revision returned by validate. JOURNEY_GRAPH_V2_ENABLED must be true after all workers are upgraded.
      security: [{ sessionCookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "201": { description: Returns version, entry and optional audience_ref; blast admission is durable via outbox }
        "400": { description: Invalid graph or rollout not enabled }
        "409": { description: Stale validation revision or journey not draft/paused }
  /v1/apps/{appId}/journeys/{id}/pause:
    parameters:
      - { $ref: "#/components/parameters/AppId" }
      - { $ref: "#/components/parameters/JourneyId" }
    post:
      operationId: pauseJourney
      security: [{ sessionCookie: [] }]
      responses:
        "201": { description: Paused; wall-clock wait deadlines continue }
  /v1/apps/{appId}/journeys/{id}/report:
    parameters:
      - { $ref: "#/components/parameters/AppId" }
      - { $ref: "#/components/parameters/JourneyId" }
    get:
      operationId: journeyReport
      description: Select version for consistent graph/node/send counts. Omitting version retains legacy all-version state and send totals. Counts are execution instances, not unique customers, except paths.unique_users.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: version
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Immutable definition and version-isolated node/path counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyReport" }
        "404": { description: Version not found }
components:
  parameters:
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JourneyId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    JourneyUpsert:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, definition]
            properties:
              name: { type: string, minLength: 1, maxLength: 200 }
              definition: { $ref: "#/components/schemas/JourneyDefinition" }
  schemas:
    JourneySummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [draft, active, paused, archived] }
        category: { type: string, enum: [marketing, transactional] }
        active_version: { type: [integer, "null"] }
        updated_at: { type: string, format: date-time }
    JourneyCapabilities:
      type: object
      required: [graph_v2, supported_node_types]
      properties:
        graph_v2: { type: boolean }
        supported_node_types: { type: array, items: { type: string, enum: [message, delay, branch, event_wait, ab_split] } }
    JourneyDefinition:
      oneOf:
        - { $ref: "#/components/schemas/LegacyJourney" }
        - { $ref: "#/components/schemas/GraphJourney" }
    JourneyBase:
      type: object
      required: [entry, nodes, exit, settings]
      properties:
        entry:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [blast, trigger] }
            segment_id: { type: string, format: uuid }
            trigger_event: { type: string }
        exit:
          type: object
          properties:
            conversion_event: { type: string, description: Takes priority over event wait }
        settings:
          type: object
          required: [category, reentry]
          properties:
            category: { type: string, enum: [marketing, transactional] }
            reentry:
              oneOf:
                - { type: string, enum: [never, always] }
                - type: object
                  required: [after_days]
                  properties:
                    after_days: { type: integer, minimum: 1 }
    LegacyJourney:
      allOf:
        - { $ref: "#/components/schemas/JourneyBase" }
        - type: object
          properties:
            schema_version: { type: integer, const: 1 }
            nodes:
              type: array
              items:
                oneOf:
                  - { $ref: "#/components/schemas/MessageNode" }
                  - { $ref: "#/components/schemas/DelayNode" }
    GraphJourney:
      allOf:
        - { $ref: "#/components/schemas/JourneyBase" }
        - type: object
          required: [schema_version, start_node_id, edges]
          properties:
            schema_version: { type: integer, const: 2 }
            start_node_id: { type: [string, "null"] }
            nodes:
              type: array
              maxItems: 65535
              items:
                allOf:
                  - type: object
                    required: [id]
                    properties:
                      id: { type: string, minLength: 1, maxLength: 128 }
                  - oneOf:
                      - { $ref: "#/components/schemas/MessageNode" }
                      - { $ref: "#/components/schemas/DelayNode" }
                      - { $ref: "#/components/schemas/BranchNode" }
                      - { $ref: "#/components/schemas/EventWaitNode" }
                      - { $ref: "#/components/schemas/ABSplitNode" }
            edges:
              type: array
              items:
                type: object
                required: [id, source, source_port, target]
                properties:
                  id: { type: string }
                  source: { type: string }
                  source_port: { type: string, description: "next, true/false, matched/timeout, or A/B variant ID; exactly one edge per output" }
                  target: { type: [string, "null"], description: "Node ID or null to end; merges are exclusive OR merges" }
    MessageNode:
      type: object
      required: [type, push]
      properties:
        id: { type: string }
        type: { type: string, const: message }
        push:
          type: object
          required: [title, body]
          properties:
            title: { type: string, maxLength: 256 }
            body: { type: string, maxLength: 2048 }
            image_url: { type: string }
            deep_link: { type: string }
    DelayNode:
      type: object
      required: [type, duration_seconds]
      properties:
        id: { type: string }
        type: { type: string, const: delay }
        duration_seconds: { type: integer, minimum: 1, maximum: 9223372036 }
    BranchNode:
      type: object
      required: [type, condition]
      properties:
        id: { type: string }
        type: { type: string, const: branch }
        condition:
          type: object
          description: Segment DSL v1; attribute comparisons and event performed/not_performed only. Unsupported fields/operators are rejected at activation.
          required: [version, operator, groups]
          properties:
            version: { type: integer, const: 1 }
            operator: { type: string, enum: [AND, OR] }
            groups:
              type: array
              minItems: 1
              maxItems: 20
              items:
                type: object
                required: [operator, conditions]
                properties:
                  operator: { type: string, enum: [AND, OR] }
                  conditions:
                    type: array
                    minItems: 1
                    maxItems: 50
                    items:
                      type: object
                      description: "attribute: key/op/value; event: event/op/window_days (1..180, default 30)"
    EventWaitNode:
      type: object
      required: [type, event_name, timeout_seconds]
      properties:
        id: { type: string }
        type: { type: string, const: event_wait }
        event_name: { type: string, minLength: 1, maxLength: 200 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 9223372036, default: 86400 }
      description: Only first server receipts after wait registration and strictly before deadline count. Offline actions first received in this interval qualify. matched/timeout is resolved once.
    ABVariant:
      type: object
      required: [id, label, weight]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        label: { type: string, minLength: 1, maxLength: 100 }
        weight: { type: integer, minimum: 1, maximum: 100 }
    ABSplitNode:
      type: object
      required: [type, variants]
      properties:
        id: { type: string }
        type: { type: string, const: ab_split }
        variants:
          type: array
          minItems: 2
          maxItems: 4
          items: { $ref: "#/components/schemas/ABVariant" }
      description: Weights total 100. Stable journey/node/customer assignment excludes version. Published IDs/order/weights cannot change; start a new experiment with a new node ID.
    JourneyValidationIssue:
      type: object
      required: [level, message]
      properties:
        level: { type: string, enum: [error, warning] }
        message: { type: string }
        node_index: { type: integer }
        node_id: { type: string }
        edge_id: { type: string }
        field: { type: string }
    JourneyReport:
      type: object
      required: [name, status, state_distribution, sends, version, versions, definition, instrumentation, nodes]
      properties:
        name: { type: string }
        status: { type: string }
        version: { type: [integer, "null"] }
        versions:
          type: array
          items:
            type: object
            properties:
              version: { type: integer }
              created_at: { type: string, format: date-time }
        definition:
          oneOf:
            - { $ref: "#/components/schemas/JourneyDefinition" }
            - { type: "null" }
        instrumentation: { type: string, enum: [available, unsupported, unpublished] }
        state_distribution: { type: object, additionalProperties: { type: integer } }
        sends:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              node_index: { type: integer }
              count: { type: integer }
        nodes:
          type: array
          items:
            type: object
            properties:
              node_id: { type: string }
              node_index: { type: integer }
              type: { type: string }
              arrived: { type: integer }
              waiting: { type: integer }
              completed: { type: integer }
              failed: { type: integer }
              paths:
                type: array
                items:
                  type: object
                  properties:
                    output_port: { type: string }
                    executions: { type: integer }
                    unique_users: { type: integer }
    Device:
      type: object
      required: [device_id, platform]
      properties:
        device_id: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        app_version: { type: string }
        os_version: { type: string }
        model: { type: string }
        locale: { type: string }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: onda_session
    apiKey:
      type: http
      scheme: bearer
      description: SDK Key(pk_) 또는 Server Key(sk_)
