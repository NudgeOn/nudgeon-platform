global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: nudgeon-local-worker
    static_configs:
      - targets: [worker:9090]
        labels: {nudgeon_cluster: local-ops}
  - job_name: nudgeon-local-dlq-monitor
    static_configs:
      - targets: [dlq-monitor:9090]
        labels: {dlq_monitor: "true", nudgeon_cluster: local-ops}
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
