global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: dlq-monitor
    static_configs:
      - targets: [monitor:9090]
        labels: {dlq_monitor: "true", nudgeon_cluster: dlq-local-qa}
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
