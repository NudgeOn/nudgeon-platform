global:
  resolve_timeout: 30s
route:
  receiver: local-only
  group_by: [nudgeon_cluster, alertname, stream, failure_class]
  group_wait: 5s
  group_interval: 5s
  repeat_interval: 10m
receivers:
  - name: local-only
    webhook_configs:
      - url: http://gateway:9194/alerts
        send_resolved: true
