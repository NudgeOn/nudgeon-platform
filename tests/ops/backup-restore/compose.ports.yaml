# 백업·복원 리허설용 포트 재배치 — 원본 스택(5433/8123/9000/6379/8080/9090/3000)과 나란히 띄운다.
services:
  postgres:
    ports: !override ["127.0.0.1:25433:5432"]
  clickhouse:
    ports: !override ["127.0.0.1:28123:8123", "127.0.0.1:29000:9000"]
  redis:
    ports: !override ["127.0.0.1:26379:6379"]
  api:
    ports: !override ["127.0.0.1:28080:8080"]
  worker:
    ports: !override ["127.0.0.1:29090:9090"]
