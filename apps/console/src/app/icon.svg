<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">NudgeOn chain reaction mark</title>
  <desc id="desc">Three rounded tiles lean progressively forward, representing one action setting the next in motion.</desc>
  <rect width="512" height="512" fill="#FFFFFF" />
  <g fill="#0B2438">
    <rect x="42" y="136" width="96" height="228" rx="18" />
    <rect x="184" y="140" width="96" height="228" rx="18" transform="rotate(14 232 254)" />
    <rect x="323" y="150" width="96" height="228" rx="18" transform="rotate(28 371 264)" />
  </g>
</svg>
