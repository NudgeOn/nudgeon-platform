events {}

http {
  access_log /dev/stdout combined;
  error_log /dev/stderr warn;

  # Docker embedded DNS. Variables defer resolution so the setup shell can start
  # before API/console exist or while a migration is blocked.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /livez {
      access_log off;
      return 200 '{"ok":true,"service":"gateway"}';
      add_header Content-Type application/json;
    }

    location = /setup-readyz {
      access_log off;
      set $setup_upstream http://setup-status:9091;
      proxy_pass $setup_upstream/readyz;
    }

    location = /setup {
      set $setup_upstream http://setup-status:9091;
      proxy_pass $setup_upstream/setup;
      proxy_set_header Host $host;
    }

    location = /setup/ {
      set $setup_upstream http://setup-status:9091;
      proxy_pass $setup_upstream/setup/;
      proxy_set_header Host $host;
    }

    location = /setup.js {
      set $setup_upstream http://setup-status:9091;
      proxy_pass $setup_upstream/setup.js;
    }

    location = /setup-diagnostics.mjs {
      set $setup_upstream http://setup-status:9091;
      proxy_pass $setup_upstream/setup-diagnostics.mjs;
    }

    location = /setup.css {
      set $setup_upstream http://setup-status:9091;
      proxy_pass $setup_upstream/setup.css;
    }

    location ^~ /setup-status/ {
      set $setup_upstream http://setup-status:9091;
      proxy_pass $setup_upstream$request_uri;
      proxy_set_header Host $host;
    }

    location ^~ /api/v1/ {
      set $api_upstream http://api:8080;
      rewrite ^/api(/.*)$ $1 break;
      proxy_pass $api_upstream$uri$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_buffering off;
      proxy_read_timeout 60s;
    }

    location / {
      proxy_intercept_errors on;
      error_page 502 503 504 =307 /setup;
      set $console_upstream http://console:3000;
      proxy_pass $console_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
