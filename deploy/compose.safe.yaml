# NudgeOn safe self-host stack — generated secrets, private data services, one gateway.
# Use the repository-root ./nudgeon helper; do not invoke this file without its state directory.

name: nudgeon-safe

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nudgeon
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: nudgeon
    secrets:
      - postgres_password
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nudgeon -d nudgeon"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: nudgeon
      CLICKHOUSE_USER: nudgeon
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    secrets:
      - clickhouse_password
    volumes:
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "CLICKHOUSE_PASSWORD=\"$$(cat /run/secrets/clickhouse_password)\" clickhouse-client --user nudgeon --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "/run/secrets/redis_config"]
    secrets:
      - redis_config
      - redis_password
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrator:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: nudgeon-migrator:${NUDGEON_VERSION:-development}
    entrypoint: ["/nudgeon-migrate"]
    command: ["/db"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      CLICKHOUSE_URL_FILE: /run/secrets/clickhouse_url
    secrets:
      - database_url
      - clickhouse_url
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: nudgeon-api:${NUDGEON_VERSION:-development}
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      CLICKHOUSE_URL_FILE: /run/secrets/clickhouse_url
      KMS_MASTER_KEY_FILE: /run/secrets/nudgeon_master_key
      MODE: single_tenant
      CORS_ORIGIN: ${NUDGEON_PUBLIC_ORIGIN:-http://localhost:8080}
      JOURNEY_GRAPH_V2_ENABLED: ${JOURNEY_GRAPH_V2_ENABLED:-false}
    secrets:
      - database_url
      - redis_url
      - clickhouse_url
      - nudgeon_master_key
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: nudgeon-worker:${NUDGEON_VERSION:-development}
    command: ["--role=all"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      CLICKHOUSE_URL_FILE: /run/secrets/clickhouse_url
      KMS_MASTER_KEY_FILE: /run/secrets/nudgeon_master_key
    secrets:
      - database_url
      - redis_url
      - clickhouse_url
      - nudgeon_master_key
    restart: unless-stopped

  console:
    build:
      context: ..
      dockerfile: apps/console/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    image: nudgeon-console:${NUDGEON_VERSION:-development}
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: /api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  setup-status:
    build:
      context: ..
      dockerfile: deploy/setup-status/Dockerfile
    image: nudgeon-setup-status:${NUDGEON_VERSION:-development}
    environment:
      NUDGEON_INSTALLATION_ID: ${NUDGEON_INSTALLATION_ID:?generated by ./nudgeon}
      NUDGEON_VERSION: ${NUDGEON_VERSION:-development}
      CHECK_TIMEOUT_MS: 4500
      API_READY_URL: http://api:8080/readyz
      WORKER_READY_URL: http://worker:9090/readyz
      CONSOLE_READY_URL: http://console:3000/
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9091/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      setup-status:
        condition: service_healthy
    ports:
      - "${NUDGEON_BIND_ADDRESS:-127.0.0.1}:${NUDGEON_PORT:-8080}:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/setup-readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

secrets:
  postgres_password:
    file: ${NUDGEON_STATE_DIR:?generated by ./nudgeon}/secrets/postgres_password
  clickhouse_password:
    file: ${NUDGEON_STATE_DIR:?generated by ./nudgeon}/secrets/clickhouse_password
  redis_password:
    file: ${NUDGEON_STATE_DIR:?generated by ./nudgeon}/secrets/redis_password
  redis_config:
    file: ${NUDGEON_STATE_DIR:?generated by ./nudgeon}/secrets/redis.conf
  database_url:
    file: ${NUDGEON_STATE_DIR:?generated by ./nudgeon}/secrets/database_url
  redis_url:
    file: ${NUDGEON_STATE_DIR:?generated by ./nudgeon}/secrets/redis_url
  clickhouse_url:
    file: ${NUDGEON_STATE_DIR:?generated by ./nudgeon}/secrets/clickhouse_url
  nudgeon_master_key:
    file: ${NUDGEON_STATE_DIR:?generated by ./nudgeon}/secrets/nudgeon_master_key

volumes:
  pg-data:
  ch-data:
  redis-data:
