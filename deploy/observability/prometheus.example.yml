global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml, /etc/prometheus/ops-alerts.yml]
scrape_configs:
  - job_name: nudgeon-worker
    static_configs:
      - targets: [worker:9090]
        labels: {nudgeon_cluster: local}
  - job_name: nudgeon-dlq-monitor
    static_configs:
      - targets: [dlq-monitor:9090]
        # One logical observer per PG database. Change this ID per installation.
        labels: {dlq_monitor: "true", nudgeon_cluster: local}
  - job_name: nudgeon-ops-monitor
    static_configs:
      - targets: [ops-monitor:9090]
        # Same installation ID as PG DLQ and workers; Redis must be standalone.
        labels: {ops_monitor: "true", nudgeon_cluster: local}
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
