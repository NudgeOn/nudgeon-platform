# NudgeOn — 로컬 개발/셀프호스팅 Compose (PRD-08 3.1)
#
#   docker compose -f deploy/compose.yaml --profile full up -d   # 번들 DB (PG+CH+Redis)
#   docker compose -f deploy/compose.yaml --profile app up -d    # 앱만 (외부/관리형 DB URL 연결) — S2에서 이미지 추가
#
# dev 환경: full 프로파일의 데이터 서비스만 띄우고 api/console/worker는 로컬 실행.
# 첫 기동 시 PG는 schema.sql + seed.dev.sql, CH는 순번 SQL이 자동 적용된다 (빈 볼륨 한정).

name: nudgeon

services:
  postgres:
    image: postgres:16
    profiles: [full]
    environment:
      POSTGRES_USER: nudgeon
      POSTGRES_PASSWORD: nudgeon
      POSTGRES_DB: nudgeon
    ports:
      - "5433:5432" # 호스트 5432는 로컬 Postgres와 충돌 잦음 — dev는 5433 사용
    volumes:
      - pg-data:/var/lib/postgresql/data
      # dev 부트스트랩 — 프로덕션은 Atlas migrator 경로 사용 (ADR-4)
      - ../db/postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../db/postgres/seed.dev.sql:/docker-entrypoint-initdb.d/02_seed_dev.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nudgeon -d nudgeon"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: [full]
    environment:
      CLICKHOUSE_DB: nudgeon
      CLICKHOUSE_USER: nudgeon
      CLICKHOUSE_PASSWORD: nudgeon
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123" # HTTP (API·worker 공용 DSN)
      - "9000:9000" # native
    volumes:
      - ch-data:/var/lib/clickhouse
      - ../db/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    profiles: [full]
    # AOF everysec 기본 — 멱등 키·dedup·cap 카운터 보존 (PRD-08 §5 v0.2 개정)
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- 애플리케이션 (app 프로파일: 이미지 빌드·기동) ---
  # 셀프호스팅 원-커맨드: docker compose -f deploy/compose.yaml --profile full --profile app up -d
  migrator:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      args:
        # worker와 같은 이미지 태그를 공유하므로 선택적 구현도 같은 태그로 빌드해야 한다.
        # 값이 다르면 병렬 빌드의 마지막 결과가 앞선 이미지를 덮어써 E2E worker가 시작되지 않는다.
        GO_TAGS: ${GO_TAGS:-}
    image: nudgeon-worker
    profiles: [app]
    # Dockerfile ENTRYPOINT는 /nudgeon-worker 고정 — 마이그레이터는 entrypoint를 덮어써야 한다
    # (미설정 시 command가 nudgeon-worker의 인자로 삼켜져 워커가 기동됨)
    entrypoint: ["/nudgeon-migrate"]
    command: ["/db"]
    # 콜드 스타트 경합 방지 — 번들 DB(full)가 healthy가 될 때까지 대기 후 마이그레이션.
    # required: false — app 단독(관리형 DB) 프로파일에서는 번들 postgres/clickhouse가 비활성이므로
    # 의존을 건너뛴다. 이게 없으면 `--profile app` config가 undefined service로 실패한다 (재검증).
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      clickhouse:
        condition: service_healthy
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://nudgeon:nudgeon@postgres:5432/nudgeon}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://nudgeon:nudgeon@clickhouse:8123/nudgeon}
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: nudgeon-api
    stop_grace_period: 20s
    profiles: [app]
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://nudgeon:nudgeon@postgres:5432/nudgeon}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://nudgeon:nudgeon@clickhouse:8123/nudgeon}
      MODE: ${MODE:-multi_tenant}
      NUDGEON_MASTER_KEY: ${NUDGEON_MASTER_KEY:?NUDGEON_MASTER_KEY 필수 (openssl rand -base64 32)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JOURNEY_GRAPH_V2_ENABLED: ${JOURNEY_GRAPH_V2_ENABLED:-false}
      API_KEY_USAGE_COALESCE_ENABLED: ${API_KEY_USAGE_COALESCE_ENABLED:-false}
      # 워커와 같은 디렉터리를 읽는다 — 콘솔의 벤더 목록과 실제 발송 가능 여부가 갈리지 않게.
      NUDGEON_CONNECTOR_MANIFESTS: ${NUDGEON_CONNECTOR_MANIFESTS:-/etc/nudgeon/connectors}
    volumes:
      - ${NUDGEON_CONNECTOR_DIR:-./connectors}:/etc/nudgeon/connectors:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      args:
        # 기본은 비어 있다. E2E에서만 GO_TAGS=nudgeon_mock으로 목 커넥터를 켠다.
        GO_TAGS: ${GO_TAGS:-}
    image: nudgeon-worker
    profiles: [app]
    depends_on:
      migrator:
        condition: service_completed_successfully
    command: ["/nudgeon-worker", "--role=all"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://nudgeon:nudgeon@postgres:5432/nudgeon}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://nudgeon:nudgeon@clickhouse:8123/nudgeon}
      NUDGEON_MASTER_KEY: ${NUDGEON_MASTER_KEY:?NUDGEON_MASTER_KEY 필수}
      # 커넥터 매니페스트 디렉터리. 여기에 놓인 *.json이 곧 "켜진 커넥터"다.
      NUDGEON_CONNECTOR_MANIFESTS: ${NUDGEON_CONNECTOR_MANIFESTS:-/etc/nudgeon/connectors}
    volumes:
      - ${NUDGEON_CONNECTOR_DIR:-./connectors}:/etc/nudgeon/connectors:ro
    ports:
      - "9090:9090" # /metrics·/healthz

  # One DB observer per installation. It does not send messages and needs no
  # master key, Redis or ClickHouse. Apply the additive migration before rollout.
  dlq-monitor:
    image: nudgeon-worker
    profiles: [app]
    depends_on:
      migrator:
        condition: service_completed_successfully
    command: ["--role=dlq-monitor"]
    environment:
      DATABASE_URL: ${DLQ_DATABASE_URL:-${DATABASE_URL:-postgres://nudgeon:nudgeon@postgres:5432/nudgeon}}
    expose: ["9090"]
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]

  console:
    build:
      context: ..
      dockerfile: apps/console/Dockerfile
      # 빌드 시점 주입 — 클라이언트 번들에 인라인될 API 주소 (런타임 env로는 변경 불가)
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    image: nudgeon-console
    profiles: [app]
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"

volumes:
  pg-data:
  ch-data:
  redis-data:
