<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 320" role="img" aria-labelledby="title desc">
  <title id="title">NudgeOn</title>
  <desc id="desc">Three progressively leaning tiles beside the NudgeOn wordmark: a small nudge sets the next action in motion.</desc>
  <rect width="970" height="320" fill="#FFFFFF" />
  <g transform="translate(24 24) scale(.55)" fill="#0B2438">
    <rect x="42" y="136" width="96" height="228" rx="18" />
    <rect x="184" y="140" width="96" height="228" rx="18" transform="rotate(14 232 254)" />
    <rect x="323" y="150" width="96" height="228" rx="18" transform="rotate(28 371 264)" />
  </g>
  <text x="320" y="213" fill="#0B2438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="128" font-weight="720" letter-spacing="-5">NudgeOn</text>
</svg>
