<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="825" viewBox="0 0 1220 825" role="img" font-family="Arial, Helvetica, sans-serif" fill="#15201e" aria-labelledby="title desc">
<title id="title">Onda system architecture</title><desc id="desc">SDKs and customer servers connect to NestJS APIs, Redis Streams and Go workers. PostgreSQL stores identities, journeys and Outbox. ClickHouse stores events and logs. FCM and APNs send push notifications. Retry, message identity, consent sync and delivery reporting remain incomplete.</desc>
